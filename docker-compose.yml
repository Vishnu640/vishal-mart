version: '3.9'

services:

  mongo:
    image: mongo:7
    container_name: vishalmart-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - vishalmart-net

  backend:
    build:
      context: ./backend
    container_name: vishalmart-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 5001
      MONGO_URI: mongodb://mongo:27017/vishalmart
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      ALLOWED_ORIGINS: http://localhost:3000
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      FRONTEND_URL: http://localhost:3000
    networks:
      - vishalmart-net

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: /api
    container_name: vishalmart-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - vishalmart-net

volumes:
  mongo_data:

networks:
  vishalmart-net:
    driver: bridge
